<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-3 rounded-2xl border border-line bg-surface p-4">
    <label class="flex items-center gap-2 rounded-full border border-line bg-background px-4 py-2.5">
      <ngx-iconify icon="lucide:search" [size]="18" class="shrink-0 text-muted" />
      <input
        type="search"
        placeholder="Buscar…"
        aria-label="Buscar productos"
        class="w-full bg-transparent text-sm outline-none placeholder:text-muted"
      />
    </label>
    <label class="flex cursor-pointer items-center gap-2 rounded-full border border-line bg-background px-4 py-2.5 text-sm font-medium">
      <span class="flex-1">Ordenar: Más vendidos</span>
      <ngx-iconify icon="lucide:chevron-down" [size]="16" />
      <select class="sr-only" aria-label="Ordenar productos">
        <option>Más vendidos</option>
        <option>Menor precio</option>
        <option>Mayor precio</option>
        <option>Mejor valorados</option>
      </select>
    </label>
    <button
      type="button"
      class="inline-flex items-center justify-center gap-2 rounded-full border border-line px-4 py-2.5 text-sm font-bold transition-colors motion-reduce:transition-none hover:border-accent hover:text-accent"
    >
      <ngx-iconify icon="lucide:rotate-ccw" [size]="16" />
      Borrar
    </button>
  </div>

  <div class="divide-y divide-line border-y border-line">
    @for (group of groups; track group.title) {
      <details class="filter-item group" name="shop-filters">
        <summary
          class="flex cursor-pointer list-none items-center justify-between gap-4 py-4 font-bold [&::-webkit-details-marker]:hidden"
        >
          {{ group.title }}
          <ngx-iconify
            icon="lucide:chevron-down"
            [size]="20"
            class="shrink-0 transition-transform duration-300 motion-reduce:transition-none group-open:rotate-180"
          />
        </summary>
        <div class="space-y-2 pb-4">
          @for (option of group.options; track option) {
            <label class="flex cursor-pointer items-center gap-3 text-sm text-muted">
              <input
                type="checkbox"
                class="h-4 w-4 rounded border-line accent-[var(--accent)]"
              />
              {{ option }}
            </label>
          }
        </div>
      </details>
    }
  </div>
</div>
