# Workspace packages. pnpm auto-installs before `pnpm run`, so without this
# list pnpm does not recognize apps/backend, prunes it from the lockfile and
# the store on every run (jest and friends disappear).
packages:
  - 'apps/backend'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
