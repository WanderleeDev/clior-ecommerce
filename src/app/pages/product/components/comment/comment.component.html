<div class="flex space-x-4 p-4 bg-gray-800 rounded-lg">
  <div class="flex-shrink-0">
    <div
      class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center"
    >
      <span class="text-white font-semibold">{{ comment().username }}</span>
    </div>
  </div>
  <div class="flex-1">
    <div class="flex items-center space-x-2 mb-1">
      <span class="text-white font-semibold">{{ comment().username }}</span>
      <span class="text-gray-400 text-sm">{{ comment().date }}</span>
      <div class="flex items-center">
        <app-rating [rating]="2" [isReadonly]="true" />
      </div>
    </div>
    <p class="text-gray-300">{{ comment().comment }}</p>
  </div>
</div>
