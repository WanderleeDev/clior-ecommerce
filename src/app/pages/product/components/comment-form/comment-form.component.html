<aside class="bg-gray-800 rounded-lg p-4">
  <h4 class="text-lg font-medium text-white mb-4">Write a Review</h4>
  <form class="space-y-4">
    <div>
      <label for="rating" class="block text-sm font-medium text-gray-300 mb-1">
        Rating
      </label>
      <app-rating
        id="rating"
        [rating]="rating"
        (ratingChange)="setRating($event)"
      />
    </div>
    <div>
      <label for="review" class="block text-sm font-medium text-gray-300 mb-1">
        Your Review
      </label>
      <textarea
        id="review"
        name="review"
        rows="4"
        class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-purple-500 focus:border-purple-500 resize-none"
        placeholder="Write your review here..."
      ></textarea>
    </div>
    <button
      type="submit"
      (click)="submitComment()"
      class="w-full px-4 py-2 text-white bg-purple-600 rounded-lg hover:bg-purple-700"
    >
      Submit Review
    </button>
  </form>
</aside>
