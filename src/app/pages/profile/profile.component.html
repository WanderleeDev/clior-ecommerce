<app-section-layout>
  <div class="flex flex-col gap-6 md:gap-10">
    <app-info-profile [dataUser]="userInfo">
      <app-user-simple-card
        username="Helene Engels"
        avatar="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/avatars/helene-engels.png"
        ngProjectAs="user"
      />

      <app-btn-base class="ml-auto" (click)="editDataUser()">
        <app-edit-svg /> Edit your data
      </app-btn-base>
    </app-info-profile>

    <app-payment-methods [paymentMethods]="paymentMethods">
      <div class="flex gap-2">
        <app-btn-base variant="outline" (click)="addPaymentMethod()">
          Add new card
        </app-btn-base>
        <app-btn-base (click)="editPaymentMethods()">
          <app-edit-svg /> Edit payment methods
        </app-btn-base>
      </div>
    </app-payment-methods>

    <div
      class="grid grid-cols-1 xs:grid-cols-2 gap-6 border-b border-t border-gray-200 py-4 dark:border-gray-700 md:py-8 lg:grid-cols-4 xl:gap-10"
    >
      @for (metric of performanceMetrics; track metric.title) {
        <a class="p-2 outline-clr" [routerLink]="['/profile/', metric.type]">
          <app-card-metric-profile [metric]="metric"></app-card-metric-profile>
        </a>
      }
    </div>
  </div>
</app-section-layout>

<ng-container>
  <!-- form for edit and add payment methods -->
</ng-container>
