<article class="flex flex-col gap-6">
  <h2
    class="flex items-center text-xl font-bold leading-none text-gray-900 dark:text-white sm:text-2xl"
  >
    Payment Methods
  </h2>

  <div class="flex flex-wrap gap-4 justify-between">
    <div class="flex flex-col gap-4">
      @for (paymentMethod of paymentMethods(); track paymentMethod) {
        <figure
          class="flex items-center space-x-4 text-gray-500 dark:text-gray-400"
        >
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-700"
          >
            <ng-template *ngComponentOutlet="icons[paymentMethod.type]" />
          </div>
          <div class="text-sm">
            <p class="mb-0.5 font-medium text-gray-900 dark:text-white">
              {{ paymentMethod.type }} ending in
              {{ paymentMethod.lastFourDigits }}
            </p>
            <p class="font-normal text-gray-500 dark:text-gray-400">
              Expiry {{ paymentMethod.expiryDate }}
            </p>
          </div>
        </figure>
      }
    </div>
    <ng-content />
  </div>
</article>
