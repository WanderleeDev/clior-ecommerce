<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="p-4 md:p-5 rounded-lg overflow-hidden bg-white shadow dark:bg-gray-800 flex flex-col gap-6"
>
  <div class="space-y-4">
    <!-- Card Type -->
    <fieldset>
      <legend
        class="mb-2 block text-sm font-medium text-gray-900 dark:text-white"
      >
        Card Type
      </legend>
      <div class="flex gap-4">
        @for (type of cardTypes; track type) {
          <div class="flex items-center">
            <input
              [id]="type"
              type="radio"
              [value]="type"
              formControlName="type"
              class="h-4 w-4 border-gray-300 bg-gray-100 text-primary-600 focus:ring-2 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:ring-offset-gray-800 dark:focus:ring-primary-600"
            />
            <label
              [for]="type"
              class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300 capitalize"
            >
              {{ type }}
            </label>
          </div>
        }
      </div>
    </fieldset>

    <!-- Card Number -->
    <div>
      <label
        for="cardNumber"
        class="mb-2 block text-sm font-medium text-gray-900 dark:text-white"
      >
        Card Number
      </label>
      <input
        type="text"
        id="cardNumber"
        formControlName="cardNumber"
        class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500"
        placeholder="**** **** **** ****"
        maxlength="19"
      />
    </div>

    <!-- Card Holder -->
    <div>
      <label
        for="cardHolder"
        class="mb-2 block text-sm font-medium text-gray-900 dark:text-white"
      >
        Card Holder
      </label>
      <input
        type="text"
        id="cardHolder"
        formControlName="cardHolder"
        class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500"
        placeholder="Name on card"
      />
    </div>

    <!-- Expiry Date and CVV -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label
          for="expiryDate"
          class="mb-2 block text-sm font-medium text-gray-900 dark:text-white"
        >
          Expiry Date
        </label>
        <input
          type="text"
          id="expiryDate"
          formControlName="expiryDate"
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500"
          placeholder="MM/YY"
          maxlength="5"
        />
      </div>
      <div>
        <label
          for="cvv"
          class="mb-2 block text-sm font-medium text-gray-900 dark:text-white"
        >
          CVV
        </label>
        <input
          type="password"
          id="cvv"
          formControlName="cvv"
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500"
          placeholder="***"
          maxlength="3"
        />
      </div>
    </div>
  </div>

  <div
    class="border-t border-gray-200 pt-4 dark:border-gray-700 md:pt-5 flex justify-end gap-4"
  >
    <app-btn-base
      variant="outline"
      space="small"
      type="button"
      (click)="close()"
    >
      Cancel
    </app-btn-base>
    <app-btn-base type="submit"> Save Card </app-btn-base>
  </div>
</form>
