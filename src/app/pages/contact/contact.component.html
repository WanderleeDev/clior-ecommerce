<app-section-layout>
  <h2
    class="text-3xl font-bold text-white mb-8 text-center"
    ngProjectAs="header"
  >
    Get in touch with our team for any questions or concerns.
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
    <app-contact-form />
    <app-contact-info />
  </div>

  <article class="mb-16">
    <h2 class="text-3xl font-bold text-white mb-8 text-center">
      Find Our Stores
    </h2>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-16">
      <app-store-map
        [center]="centerMap()"
        [(zoom)]="zoomMap"
        [stores]="cliorStores()"
      />

      <section class="container-style p-6 h-96 overflow-y-auto customScrollbar">
        <h3 class="text-xl font-semibold text-white mb-4">Our Stores</h3>
        <div class="space-y-4">
          @for (store of cliorStores(); track $index) {
            <app-store-direction [store]="store">
              <button
                class="absolute inset-0 rounded-md hover:bg-sky-600/10 focus:bg-sky-600/10"
                [class.active-card]="currentIndexStore() === $index"
                (click)="showDirection(store.location, $index)"
                aria-label="store direction"
                type="button"
              ></button>
            </app-store-direction>
          }
        </div>
      </section>
    </div>
  </article>
</app-section-layout>
