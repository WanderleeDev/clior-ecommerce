<div class="border-b border-gray-100 pb-4">
  <div class="flex gap-3 md:gap-4">
    <!-- Image container with fixed dimensions -->
    <div class="w-24 h-24 flex-shrink-0">
      <!-- <img
          [src]="item.image"
          [alt]="item.name"
          class="w-full h-full object-cover rounded-lg border border-gray-100"
        /> -->
    </div>

    <!-- Product details with flexible width -->
    <div class="flex-1 min-w-0">
      <div class="flex flex-col gap-1">
        <div class="flex items-start justify-between gap-2">
          <h3 class="text-sm font-medium text-gray-900 md:text-base">
            {{ product().name }}
          </h3>
          <p class="text-sm font-medium text-gray-900 md:text-base">
            {{ product().price * product().quantity | currency }}
          </p>
        </div>

        <div class="flex items-center justify-between mt-2">
          <!-- Quantity controls -->
          <div class="flex items-center gap-3">
            <button
              class="w-8 h-8 inline-flex items-center justify-center rounded-md border border-gray-200 text-gray-600"
            >
              -
            </button>
            <span class="w-4 text-center text-sm">{{
              product().quantity
            }}</span>
            <button
              class="w-8 h-8 inline-flex items-center justify-center rounded-md border border-gray-200 text-gray-600"
            >
              +
            </button>
          </div>

          <button class="text-sm text-red-600 font-medium">Remove</button>
        </div>
      </div>
    </div>
  </div>
</div>
