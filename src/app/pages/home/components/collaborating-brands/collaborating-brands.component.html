<app-section-layout customClass="contents" class="contents">
  <header class="text-center pt-20 pb-14" ngProjectAs="header">
    <h2 class="text-4xl font-bold text-white mb-4">Collaborating Brands</h2>
    <p class="text-gray-400 text-lg">
      We are proud to partner with the following brands
    </p>
  </header>

  @for (brandList of brands; track $index) {
    <app-marquee-infinite
      [repetitions]="5"
      [reverseAnimation]="$index % 2 !== 0"
    >
      <ng-template #content>
        @for (brand of brandList; track brand.src) {
          <img [ngSrc]="brand.src" [alt]="brand.alt" width="99" height="115" />
        }
      </ng-template>
    </app-marquee-infinite>
  }
</app-section-layout>
