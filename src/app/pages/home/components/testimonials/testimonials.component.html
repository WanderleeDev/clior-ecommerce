<app-section-layout customClass="contents" class="contents">
  <header class="text-center mb-16" ngProjectAs="header">
    <h2 class="text-4xl font-bold text-white mb-4 text-center">
      What Our Customers Say
    </h2>
  </header>

  <app-marquee-infinite
    messageEmpty="No testimonials available for now, coming soon"
    pauseAnimation
  >
    <ng-template #content>
      @for (comment of testimonials(); track $index) {
        <app-card-testimonial
          class="transition-all hover:-translate-y-2 duration-300 hover:shadow-lg"
          [comment]="comment"
        />
      } @empty {
        <div class="text-white text-lg">No comments available</div>
      }
    </ng-template>
  </app-marquee-infinite>
</app-section-layout>
