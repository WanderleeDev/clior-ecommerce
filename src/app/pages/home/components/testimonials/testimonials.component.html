<div class="bg-gray-800 p-6 rounded-lg h-full">
  <p class="text-gray-300 mb-4">"{{ comment().content }}"</p>
  <div class="flex items-center">
    <img
      [src]="comment().image"
      [alt]="comment().author"
      class="w-10 h-10 rounded-full mr-3"
    />
    <div>
      <h4 class="text-white font-medium">{{ comment().author }}</h4>
      <p class="text-gray-400 text-sm">{{ comment().title }}</p>
    </div>
  </div>
</div>
