<app-section-layout>
  <h2 class="sr-only" ngAsProject="header">More info</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <article>
      <h3 class="text-2xl font-bold text-white mb-4">Need Help?</h3>
      <p class="text-gray-400 mb-6">
        Our supplement experts are here to help you achieve your fitness goals.
      </p>
      <div class="space-y-4">
        @for (info of infoContact; track $index) {
          <div class="text-blue-500 flex gap-2 items-center">
            <ng-container *ngComponentOutlet="info.icon" />
            <span class="text-gray-300">{{ info.text }}</span>
          </div>
        }
      </div>
    </article>
    <article>
      <h3 class="text-2xl font-bold text-white mb-4">Operating Hours</h3>
      <div class="space-y-2 text-gray-400">
        @for (hour of businessHours; track $index) {
          <p>{{ hour }}</p>
        }
      </div>
    </article>
  </div>
</app-section-layout>
