<form
  class="container-style max-w-sm mx-auto w-full sm:max-w-md grid grid-cols-1 gap-4"
  autocomplete="off"
  [formGroup]="form"
  errorTailor
  (ngSubmit)="submitForm()"
>
  @for (field of fields | keyvalue: null; track field.key) {
    <label
      class="block text-sm font-medium text-gray-300 mb-1 capitalize relative"
      [for]="field.key + $index"
    >
      @if (field.value.type !== "checkbox") {
        {{ field.key }}
        <input
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-blue-600 focus:border-transparent"
          [id]="field.key + $index"
          [formControlName]="field.key"
          [type]="field.value.type"
        />
      } @else {
        <input
          class="w-4 h-4 border rounded focus:ring-3 bg-gray-700 border-gray-600 focus:ring-blue-600 ring-offset-gray-800 focus:ring-offset-gray-800"
          [id]="field.key + $index"
          [formControlName]="field.key"
          [type]="field.value.type"
        />
        @if (field.value.placeholder) {
          <span class="pl-3">{{ field.value.placeholder }}</span>
        }
      }
    </label>
  }

  <app-btn-base
    class="pt-4"
    type="submit"
    maxSize
    title="{{ isValidForm ? 'submit message' : 'complete all fields' }}"
    [disabled]="!isValidForm"
  >
    send message
  </app-btn-base>
</form>
