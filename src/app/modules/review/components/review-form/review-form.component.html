<aside class="bg-gray-800 rounded-lg p-4">
  <h4 class="text-lg font-medium text-white mb-4">Write a Review</h4>
  <form
    class="space-y-4"
    novalidate
    autocomplete="off"
    [formGroup]="form"
    errorTailor
  >
    <div>
      <label for="rating" class="block text-sm font-medium text-gray-300 mb-1">
        Rating
      </label>
      <app-rating id="rating" [rating]="0" />
    </div>
    <div class="relative">
      <label for="review" class="block text-sm font-medium text-gray-300 mb-1">
        Your Review
      </label>
      <textarea
        id="review"
        name="review"
        rows="4"
        formControlName="comment"
        class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-blue-500 focus:border-blue-500 resize-none"
        placeholder="Write your review here..."
      ></textarea>
    </div>
    <app-btn-base type="submit" [disabled]="!isValidForm" maxSize>
      Submit Review
    </app-btn-base>
  </form>
</aside>
