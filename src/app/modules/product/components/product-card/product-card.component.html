<article
  class="product-card bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700"
>
  <a
    class="overflow-hidden block outline-clr"
    title="View product"
    [routerLink]="['/products', product().id]"
  >
    <app-image-optimized
      customClass="h-48"
      [imageBase]="product().thumbnail"
      [title]="product().name"
      bgBase
    >
      @if (product().discount) {
        <app-tag
          class="absolute top-2 right-2"
          content="Up to {{ product().discount | percent }} off"
        />
      }
    </app-image-optimized>

    <div class="flex flex-col gap-3 p-5">
      <h2
        class="product-name text-2xl font-bold tracking-tight text-gray-900 dark:text-white truncate"
      >
        {{ product().name }}
      </h2>

      <p
        class="product-description font-normal text-gray-700 dark:text-gray-400 h-[4.5rem] overflow-hidden"
        title="{{ product().description }}"
      >
        {{ product().description }}
      </p>

      <app-rating
        [rating]="product().rating.rate"
        [isReadonly]="true"
        [sizeStar]="18"
        [quantityReview]="product().rating.count"
      />

      <footer
        class="product-purchase flex items-center justify-between flex-wrap gap-5"
      >
        <data
          class="basis-2/6 text-3xl font-bold text-gray-900 dark:text-white"
          value="{{ product().price | currency }}"
        >
          {{ product().price | currency }}
        </data>
        <ng-content />
      </footer>
    </div>
  </a>
</article>
