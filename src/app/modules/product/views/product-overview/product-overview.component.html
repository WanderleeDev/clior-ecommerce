<app-section-layout>
  @if (this.productResource.isLoading()) {
    <app-loader class="py-32" textComplementary="loading product" />
  } @else if (this.productResource.error()) {
    <app-not-found message="Oops! Products not found">
      <app-button-flowbite
        label="Back to products"
        (click)="this.navigateToProducts()"
      />
    </app-not-found>
  } @else if (this.productResource.hasValue()) {
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12">
      <app-product-image-gallery [title]="this.productResource.value().name" />

      <app-product-info [productInfo]="this.productResource.value()">
        <app-tag content="In stock" ngProjectAs="tag" />
        <app-product-form-order ngProjectAs="extra" />
      </app-product-info>
    </div>

    @defer (on viewport) {
      <section class="mt-12" id="review">
        <h3 class="text-2xl font-bold text-white mb-6">Customer Reviews</h3>

        <div class="grid gap-8 md:grid-cols-2">
          <app-review-list [reviews]="reviews()" />
          <app-review-form />
        </div>
      </section>
    } @placeholder {
      <app-loader
        id="review"
        class="py-32"
        textComplementary="loading reviews"
      />
    }
  }
</app-section-layout>
