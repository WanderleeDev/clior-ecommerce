<section class="antialiased overflow-x-hidden">
  <button
    data-drawer-target="drawer-navigation"
    data-drawer-toggle="drawer-navigation"
    aria-controls="drawer-navigation"
    class="p-2 mr-2 text-gray-600 rounded-lg cursor-pointer md:hidden hover:text-gray-900 hover:bg-gray-100 focus:bg-gray-100 dark:focus:bg-gray-700 focus:ring-2 focus:ring-gray-100 dark:focus:ring-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
  >
    <svg
      aria-hidden="true"
      class="w-6 h-6"
      fill="currentColor"
      viewBox="0 0 20 20"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        fill-rule="evenodd"
        d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
        clip-rule="evenodd"
      ></path>
    </svg>
    <svg
      aria-hidden="true"
      class="hidden w-6 h-6"
      fill="currentColor"
      viewBox="0 0 20 20"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        fill-rule="evenodd"
        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
        clip-rule="evenodd"
      ></path>
    </svg>
    <span class="sr-only">Toggle sidebar</span>
  </button>

  <app-sidebar
    class="fixed top-0 left-0 z-40 pt-20 transition-transform -translate-x-full md:translate-x-0 customScrollbar"
    id="drawer-navigation"
  />
  <div
    class="p-4 md:ml-64 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
  >
    @if (productsResource.isLoading()) {
      <div class="col-span-full text-center">
        <p class="text-gray-500">Loading...</p>
      </div>
    } @else if (productsResource.error()) {
      <div class="col-span-full text-center">
        <p class="text-gray-500">Error loading products</p>
      </div>
    } @else {
      @for (product of productsResource.value(); track product.id) {
        <app-product-card [product]="product">
          <app-btn-base
            class="basis-3/6 grow"
            [title]="'Add to cart'"
            (click)="addProduct($event, product)"
          >
            Add to cart
          </app-btn-base>
        </app-product-card>
      } @empty {
        <div class="col-span-full text-center">
          <p class="text-gray-500">No products found</p>
        </div>
      }
    }
    <!-- <span #container appInfiniteScroll (action)="loadMore()"></span> -->
  </div>
</section>
