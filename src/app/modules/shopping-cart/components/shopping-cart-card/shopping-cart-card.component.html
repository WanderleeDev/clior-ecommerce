@let p = product();
@let totalPrice = p.price * p.quantity | currency;

<article class="border-b border-gray-100 pb-4 p-2 text-gray-100">
  <div class="flex gap-3 md:gap-8">
    <div class="w-24 h-24 flex-shrink-0">
      <img
        [src]="p.thumbnail"
        [alt]="p.name"
        class="w-full h-full object-cover rounded-lg border border-gray-100"
      />
    </div>

    <div class="flex-1 min-w-0">
      <div class="flex flex-col gap-1">
        <header class="flex items-start gap-2">
          <h3 class="text-sm font-medium md:text-base">
            {{ p.name }}
          </h3>
          <app-tag [content]="totalPrice!" />
        </header>
        <div class="flex items-center justify-between mt-2">
          <ng-content />
        </div>
      </div>
    </div>
  </div>
</article>
