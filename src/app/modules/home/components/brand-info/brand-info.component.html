<app-section-layout>
  <header class="text-center mb-16" ngProjectAs="header">
    <h2 class="text-4xl font-bold text-white mb-4">Why Clior?</h2>
    <p class="text-gray-400 text-lg">
      Discover why choosing us is your best decision for premium supplements.
    </p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
    @for (card of cards; track card.title) {
      <app-simple-card [card]="card">
        <ng-container *ngComponentOutlet="card.icon" />
      </app-simple-card>
    }
  </div>
</app-section-layout>
