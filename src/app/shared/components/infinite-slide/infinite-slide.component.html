<div class="container mx-auto px-4">
  @if (title()) {
    <h2
      class="text-3xl md:text-4xl lg:text-5xl font-bold text-white mb-4 md:mb-6 lg:mb-8 text-center"
    >
      {{ title() }}
    </h2>
  }

  <div class="slider">
    <div class="slide-track">
      <!-- Primera copia de los logos -->
      @for (logo of logos; track logo.alt) {
        <div class="slide">
          <img
            [src]="logo.src"
            [alt]="logo.alt"
            class="w-full h-auto object-contain"
            loading="lazy"
          />
        </div>
      }

      <!-- Segunda copia de los logos para el efecto infinito -->
      @for (logo of logos; track logo.alt) {
        <div class="slide">
          <img
            [src]="logo.src"
            [alt]="logo.alt"
            class="w-full h-auto object-contain"
            loading="lazy"
          />
        </div>
      }
    </div>
  </div>
</div>
