<div class="relative h-dvh min-w-dvw overflow-hidden">
  <div
    class="inset-0 absolute bg-black/15 after:bg-blend-multiply z-10"
    aria-hidden="true"
  ></div>
  <video
    #videoPlayer
    (timeupdate)="onProgress(videoPlayer)"
    class="w-auto h-auto min-w-full min-h-full absolute object-cover bg-gray-700 bg-blend-multiply aspect-video top-2/4 left-2/4 -translate-x-2/4 -translate-y-2/4 z-0"
    [src]="videoUrl()"
    muted
    autoplay
    loop
  ></video>
</div>
