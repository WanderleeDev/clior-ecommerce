<button [attr.data-dropdown-toggle]="dropdownId()" type="button">
  <ng-content select="button"> Open dropdown </ng-content>
</button>

<div
  [id]="dropdownId()"
  [attr.aria-labelledby]="ariaLabelledBy()"
  class="z-50 hidden divide-y divide-gray-100 rounded-lg shadow-sm max-w-44 w-full bg-gray-700 right-0 md:max-w-64"
>
  <ng-content select="body"> Dropdown body </ng-content>
</div>
