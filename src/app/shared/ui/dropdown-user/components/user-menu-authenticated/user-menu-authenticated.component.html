<div
  class="z-50 my-4 w-56 text-base list-none bg-white divide-y divide-gray-100 shadow dark:bg-gray-700 dark:divide-gray-600 rounded-xl block"
  id="dropdown"
  data-popper-placement="bottom"
>
  <div
    class="py-3 px-4 text-sm font-semibold text-gray-900 dark:text-white capitalize"
  >
    {{ username() || "Unknown user" }}
  </div>
  <ul class="py-1 text-gray-700 dark:text-gray-300" aria-labelledby="dropdown">
    <li>
      <a
        routerLink="/profile"
        class="block py-2 px-4 text-sm hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-gray-400 dark:hover:text-white"
        >My profile</a
      >
    </li>
    <li>
      <a
        href=""
        class="block py-2 px-4 text-sm hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-gray-400 dark:hover:text-white"
        >Account settings</a
      >
    </li>
  </ul>
  <div class="py-2 px-4" aria-labelledby="dropdown">
    <ng-content />
  </div>
</div>
