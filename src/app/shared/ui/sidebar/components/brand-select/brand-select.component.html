<label for="brands" class="block mb-2 text-sm font-medium">
  <span class="text-white font-semibold">Brand</span>
  <select
    #ref
    [disabled]="isDisabled"
    [value]="brandSelected()"
    id="brands"
    class="block w-full p-2 text-sm border rounded-lg bg-gray-700 border-gray-600 placeholder-gray-400 focus:ring-blue-500 focus:border-blue-500"
    (change)="onSelectBrand(ref.value)"
  >
    <option selected disabled>Choose your brand</option>
    @for (brand of brands(); track $index) {
      <option [value]="brand">{{ brand }}</option>
    }
  </select>
</label>
