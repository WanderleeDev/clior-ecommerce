<div class="space-y-2">
  <span class="text-white text-sm font-semibold capitalize">{{ label() }}</span>
  <div class="space-y-2">
    @for (rating of ratings; track rating) {
      <label
        class="flex items-center space-x-3 text-sm text-gray-400"
        [for]="'rating-' + rating"
      >
        <input
          class="w-4 h-4 text-blue-600 bg-gray-700 border-gray-600"
          type="radio"
          [disabled]="isDisabled"
          [value]="rating"
          [id]="'rating-' + rating"
          name="rating"
          (change)="onSelectRating(rating)"
          (blur)="(onTouch)"
        />
        <app-rating isReadonly [rating]="rating" />
      </label>
    }
  </div>
</div>
